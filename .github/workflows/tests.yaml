name: Tests

on:
  workflow_call:
    inputs:
      lines:
        description: The upstream lines the build workflow built as JSON
        type: string
        required: true

permissions: {}

cache-mode: none

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint repository
    permissions:
      contents: read
    runs-on: ubuntu-26.04 # https://github.com/actions/runner-images
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Lint the repository
        run: scripts/lint.sh

      - name: Verify the action lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        # https://github.com/github/gh-actions-lock/releases/tag/v0.4.0
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.0
          gh actions-lock --verify

  test:
    name: Test image (${{ matrix.line.name }}, ${{ matrix.platform }})
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }} # https://github.com/actions/runner-images
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        line: ${{ fromJSON(inputs.lines) }}
        platform: [linux/amd64, linux/arm64, linux/arm/v7, linux/arm/v6, linux/riscv64, linux/ppc64le, linux/s390x, linux/386]
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-26.04-arm
          - platform: linux/arm/v7
            arch: armv7
            runner: ubuntu-26.04-arm
            qemu: true
          - platform: linux/arm/v6
            arch: armv6
            runner: ubuntu-26.04-arm
            qemu: true
          - platform: linux/riscv64
            arch: riscv64
            runner: ubuntu-26.04
            qemu: true
          - platform: linux/ppc64le
            arch: ppc64le
            runner: ubuntu-26.04
            qemu: true
          - platform: linux/s390x
            arch: s390x
            runner: ubuntu-26.04
            qemu: true
          - platform: linux/386
            arch: "386"
            runner: ubuntu-26.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download the image
        uses: actions/download-artifact@v8.0.2
        with:
          name: image-${{ matrix.line.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/image

      - name: Set up QEMU
        if: ${{ matrix.qemu }}
        uses: docker/setup-qemu-action@v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 # https://github.com/tonistiigi/binfmt/releases/tag/deploy/v10.2.3-68
          cache-image: false

      - name: Load the image
        run: tar -cf - -C "$RUNNER_TEMP/image" . | docker load

      - name: Test the image
        run: scripts/test.sh peakimages/sqlite:test
