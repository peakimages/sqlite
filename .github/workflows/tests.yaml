name: Tests

on:
  workflow_call:
    inputs:
      lines:
        description: The upstream lines the build workflow built as JSON
        type: string
        required: true

permissions: {}

cache-mode: none

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    permissions:
      contents: read
    runs-on: ubuntu-26.04 # https://github.com/actions/runner-images
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false

      - run: scripts/lint.sh

  test:
    name: Test ${{ matrix.line.name }} ${{ matrix.platform }}
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }} # https://github.com/actions/runner-images
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        line: ${{ fromJSON(inputs.lines) }}
        platform: [linux/amd64, linux/arm64, linux/arm/v7, linux/riscv64]
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-26.04-arm
          - platform: linux/arm/v7
            arch: armv7
            runner: ubuntu-26.04-arm
            qemu: true
          - platform: linux/riscv64
            arch: riscv64
            runner: ubuntu-26.04
            qemu: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # https://github.com/actions/download-artifact/releases/tag/v8.0.2
        with:
          name: image-${{ matrix.line.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/image

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # https://github.com/docker/setup-qemu-action/releases/tag/v4.4.0
        if: ${{ matrix.qemu }}
        with:
          cache-image: false

      - name: Load the image
        run: tar -cf - -C "$RUNNER_TEMP/image" . | docker load

      - run: scripts/test.sh peakimages/sqlite:test
