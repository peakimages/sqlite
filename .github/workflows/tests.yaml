name: Tests

on:
  push:
    branches: [main, next]
    paths:
      - src/**
      - scripts/**
      - .github/**
      - .editorconfig
  pull_request:
    paths:
      - src/**
      - scripts/**
      - .github/**
      - .editorconfig
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-26.04 # https://github.com/actions/runner-images
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false

      - run: scripts/lint.sh

  test:
    needs: lint
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }} # https://github.com/actions/runner-images
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
          - platform: linux/arm/v7
            runner: ubuntu-26.04-arm
            qemu: true
          - platform: linux/riscv64
            runner: ubuntu-26.04
            qemu: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # https://github.com/docker/setup-qemu-action/releases/tag/v4.4.0
        if: matrix.qemu

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # https://github.com/docker/setup-buildx-action/releases/tag/v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # https://github.com/docker/build-push-action/releases/tag/v7.4.0
        with:
          context: src
          platforms: ${{ matrix.platform }}
          load: true
          tags: peakimages/sqlite:test

      - run: scripts/test.sh peakimages/sqlite:test

  release:
    needs: test
    if: github.repository == 'peakimages/sqlite' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      packages: write
    uses: $/.github/workflows/release.yaml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
