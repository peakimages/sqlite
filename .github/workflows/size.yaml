name: Size

on:
  pull_request:
    paths:
      - src/**
      - scripts/size.sh
      - .github/workflows/size.yaml

permissions: {}

cache-mode: none

concurrency:
  group: size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.platform }}
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository || !(github.head_ref == 'main' || github.head_ref == 'next' || startsWith(github.head_ref, 'release/') || endsWith(github.head_ref, '.x')) }}
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }} # https://github.com/actions/runner-images
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-26.04-arm
          - platform: linux/arm/v7
            arch: armv7
            runner: ubuntu-26.04-arm
            qemu: true
          - platform: linux/arm/v6
            arch: armv6
            runner: ubuntu-26.04-arm
            qemu: true
          - platform: linux/riscv64
            arch: riscv64
            runner: ubuntu-26.04
            qemu: true
          - platform: linux/ppc64le
            arch: ppc64le
            runner: ubuntu-26.04
            qemu: true
          - platform: linux/s390x
            arch: s390x
            runner: ubuntu-26.04
            qemu: true
          - platform: linux/386
            arch: "386"
            runner: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false

      - name: Set the build arguments
        id: args
        env:
          BRANCH: ${{ github.base_ref }}
        run: |
          image_version="$(scripts/version.sh --build)"
          {
            echo "image-version=$image_version"
            echo "epoch=$(git log -1 --format=%ct)"
            echo "created=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # https://github.com/docker/setup-qemu-action/releases/tag/v4.4.0
        if: ${{ matrix.qemu }}
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 # https://github.com/tonistiigi/binfmt/releases/tag/deploy/v10.2.3-68
          cache-image: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # https://github.com/docker/setup-buildx-action/releases/tag/v4.4.1
        with:
          cache-binary: false

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # https://github.com/docker/build-push-action/releases/tag/v7.4.0
        with:
          context: src
          platforms: ${{ matrix.platform }}
          outputs: type=oci,dest=${{ runner.temp }}/image,tar=false,rewrite-timestamp=true,compression=zstd,compression-level=11,force-compression=true
          build-args: |
            IMAGE_VERSION=${{ steps.args.outputs.image-version }}
            SOURCE_DATE_EPOCH=${{ steps.args.outputs.epoch }}
            CREATED=${{ steps.args.outputs.created }}
            GIT_SHA=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image
          if-no-files-found: error
          retention-days: 1

  report:
    name: Compare with the latest release
    needs: build
    permissions:
      contents: read
      pull-requests: write # comment the size report on the pull request
    runs-on: ubuntu-26.04 # https://github.com/actions/runner-images
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # https://github.com/actions/download-artifact/releases/tag/v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images

      - name: Compare the size with the latest release
        env:
          OUTPUT_FILE: ${{ runner.temp }}/size.md
        run: |
          scripts/size.sh "$RUNNER_TEMP/images" peakimages/sqlite:latest
          cat "$OUTPUT_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the size on the pull request
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PULL_REQUEST" --body-file "$RUNNER_TEMP/size.md" --edit-last --create-if-none
