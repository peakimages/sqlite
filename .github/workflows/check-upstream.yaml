name: Check upstream

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-26.04 # https://github.com/actions/runner-images
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false

      - run: scripts/check-upstream.sh

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet && exit 0
          version="$(jq -r .version src/version.json)"
          source_id="$(jq -r .source_id src/version.json)"
          branch="feat/sqlite-v$version"
          title="feat(release): bump SQLite version to v$version"
          if [ -n "$(gh pr list --head "$branch" --json number --jq '.[0].number')" ]; then
            echo "a pull request from $branch is open already"
            exit 0
          fi
          cat > "$RUNNER_TEMP/body.md" <<BODY
          Release notes: https://sqlite.org/releaselog/${version//./_}.html

          Source id \`$source_id\`, confirm the check-in on https://sqlite.org/src/timeline?t=release before merging.

          > [!IMPORTANT]
          > Squash merge this PR to keep the commit history clean.

          BODY
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git commit --all --quiet --message "$title"
          git push --quiet --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"
