name: Check upstream

on:
  schedule:
    - cron: "30 6,18 * * *"
  workflow_dispatch:

permissions: {}

cache-mode: none

concurrency:
  group: check-upstream
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check for a new SQLite release
    permissions:
      actions: write # run the tests on the branch of the pull request
      contents: write # push the branch of the pull request
      pull-requests: write # open the pull request
    runs-on: ubuntu-26.04 # https://github.com/actions/runner-images
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false

      - run: scripts/check-upstream.sh

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet && exit 0
          current_version="$(git show HEAD:src/upstream.json | jq -r .sqlite.latest.version)"
          new_version="$(jq -r .sqlite.latest.version src/upstream.json)"
          source_id="$(jq -r .sqlite.latest.source_id src/upstream.json)"
          check_in="${source_id##* }"
          branch="feat/sqlite-v$new_version"
          title="feat(release): bump SQLite version from v$current_version to v$new_version"
          if [ -n "$(gh pr list --head "$branch" --json number --jq '.[0].number')" ]; then
            echo "a pull request from $branch is open already"
            exit 0
          fi
          cat > "$RUNNER_TEMP/body.md" <<BODY
          Updates SQLite to $new_version, the latest release on sqlite.org, see its [release notes](https://sqlite.org/releaselog/${new_version//./_}.html) and its [release check-in](https://sqlite.org/src/info/$check_in).

          ## Changes

          - Bump SQLite version from v$current_version to v$new_version

          > [!IMPORTANT]
          > Squash merge this PR to keep the commit history clean.
          BODY
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git commit --all --quiet --message "$title"
          git push --quiet --set-upstream origin "$branch"
          new_pr="$(gh pr create --base main --head "$branch" --title "$title" --label bot/upstream --body-file "$RUNNER_TEMP/body.md")"
          gh workflow run tests.yaml --ref "$branch"
          for open_pr in $(gh pr list --label bot/upstream --json url --jq '.[].url'); do
            [ "$open_pr" = "$new_pr" ] || gh pr close "$open_pr" --delete-branch --comment "Superseded by $new_pr"
          done
