name: Clean manifests

on:
  workflow_dispatch:

permissions: {}

cache-mode: none

concurrency:
  group: clean-manifests
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  clean:
    name: Delete unused manifests
    if: ${{ github.repository == 'peakimages/sqlite' }}
    permissions:
      contents: read
    environment:
      name: cleanup
      deployment: false
    runs-on: ubuntu-26.04 # https://github.com/actions/runner-images
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Delete the unused manifests
        env:
          GH_TOKEN: ${{ secrets.GHCR_CLEANUP_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_CLEANUP_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_CLEANUP_TOKEN }}
        run: scripts/clean-manifests.sh --delete 200

      - uses: actions/upload-artifact@v7.0.2
        if: ${{ always() }}
        with:
          name: deleted-manifests
          path: scripts/deleted-manifests.tsv
          if-no-files-found: ignore
          retention-days: 90
